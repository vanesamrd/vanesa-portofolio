services:
  - type: web
    name: vanesa-portfolio
    runtime: docker
    plan: free
    region: singapore
    branch: main
    envVars:
      - key: APP_NAME
        value: "Portofolio Vanesa"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: vanesa-portfolio
          property: host
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
