<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D3C"/>
      <stop offset="50%" stop-color="#164E63"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgHl)"/>

  <!-- Left: Case Study Specifications -->
  <g transform="translate(60, 45)">
    <rect width="360" height="360" rx="14" fill="rgba(12, 74, 96, 0.75)" stroke="#0E7490" stroke-width="1.5"/>
    
    <text x="24" y="38" fill="#38BDF8" font-size="12" font-weight="bold" font-family="sans-serif">ACCESSIBLE HEALTHCARE UI/UX</text>
    <text x="24" y="68" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="sans-serif">HealthEase Mobile App</text>
    <text x="24" y="90" fill="#BAE6FD" font-size="12" font-family="sans-serif">Telemedicine &amp; Senior-Friendly Medical Companion</text>

    <!-- WCAG Badge -->
    <rect x="24" y="112" width="312" height="75" rx="8" fill="#083344" stroke="#0891B2"/>
    <text x="40" y="138" fill="#7DD3FC" font-size="11" font-family="sans-serif">Accessibility Compliance</text>
    <text x="40" y="166" fill="#38BDF8" font-size="22" font-weight="bold" font-family="sans-serif">WCAG 2.1 AA Certified</text>

    <!-- Key UX Pillars -->
    <text x="24" y="215" fill="#E0F2FE" font-size="12" font-weight="600" font-family="sans-serif">Fokus Perancangan Pengalaman:</text>
    
    <g transform="translate(24, 230)">
      <rect width="312" height="34" rx="6" fill="#155E75"/>
      <text x="14" y="22" fill="#FFFFFF" font-size="11" font-family="sans-serif">🔍 Tipografi kontras tinggi &amp; font minimum 16px</text>
    </g>
    <g transform="translate(24, 272)">
      <rect width="312" height="34" rx="6" fill="#155E75"/>
      <text x="14" y="22" fill="#FFFFFF" font-size="11" font-family="sans-serif">⏰ Notifikasi alarm minum obat visual &amp; audio</text>
    </g>
    <g transform="translate(24, 314)">
      <rect width="312" height="34" rx="6" fill="#155E75"/>
      <text x="14" y="22" fill="#FFFFFF" font-size="11" font-family="sans-serif">🩺 1-Click konsultasi dokter via video call</text>
    </g>
  </g>

  <!-- Right: Phone Mockup -->
  <g transform="translate(470, 30)">
    <rect width="250" height="390" rx="36" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <rect x="10" y="10" width="230" height="370" rx="28" fill="#F8FAFC"/>
    
    <rect x="85" y="16" width="60" height="14" rx="7" fill="#000000"/>

    <!-- App Header -->
    <g transform="translate(20, 48)">
      <text x="0" y="16" fill="#64748B" font-size="10" font-family="sans-serif">Jadwal Hari Ini</text>
      <text x="0" y="34" fill="#0F172A" font-size="15" font-weight="bold" font-family="sans-serif">Konsultasi Dokter</text>
      <circle cx="195" cy="22" r="14" fill="#0284C7" fill-opacity="0.15"/>
      <text x="190" y="27" fill="#0284C7" font-size="12">📞</text>
    </g>

    <!-- Doctor Card -->
    <g transform="translate(20, 95)">
      <rect width="190" height="100" rx="12" fill="#0284C7"/>
      <circle cx="38" cy="40" r="22" fill="#FFFFFF"/>
      <text x="28" y="47" fill="#0284C7" font-size="20">👨‍⚕️</text>
      <text x="70" y="34" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="sans-serif">dr. Farhan, Sp.PD</text>
      <text x="70" y="48" fill="#BAE6FD" font-size="9" font-family="sans-serif">Spesialis Penyakit Dalam</text>
      <rect x="70" y="58" width="75" height="18" rx="4" fill="#0369A1"/>
      <text x="76" y="70" fill="#E0F2FE" font-size="8" font-family="sans-serif">⭐ 4.9 (1.2k review)</text>
      
      <rect x="12" y="78" width="166" height="18" rx="4" fill="#FFFFFF"/>
      <text x="35" y="91" fill="#0369A1" font-size="9" font-weight="bold" font-family="sans-serif">Mulai Video Call (14:00)</text>
    </g>

    <!-- Medicine Reminder Card -->
    <g transform="translate(20, 208)">
      <rect width="190" height="95" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="14" y="22" fill="#0F172A" font-size="11" font-weight="bold" font-family="sans-serif">Pengingat Minum Obat</text>
      
      <!-- Medicine 1 -->
      <g transform="translate(14, 32)">
        <circle cx="12" cy="12" r="10" fill="#EF4444" fill-opacity="0.15"/>
        <text x="8" y="16" fill="#EF4444" font-size="11">💊</text>
        <text x="30" y="10" fill="#1E293B" font-size="10" font-weight="600" font-family="sans-serif">Amlodipine 5mg</text>
        <text x="30" y="22" fill="#64748B" font-size="8" font-family="sans-serif">1 Tablet setelah makan · Siang</text>
        <!-- Toggle check -->
        <rect x="140" y="2" width="18" height="18" rx="4" fill="#10B981"/>
        <text x="144" y="15" fill="#FFFFFF" font-size="10">✓</text>
      </g>

      <!-- Medicine 2 -->
      <g transform="translate(14, 62)">
        <circle cx="12" cy="12" r="10" fill="#F59E0B" fill-opacity="0.15"/>
        <text x="8" y="16" fill="#F59E0B" font-size="11">💊</text>
        <text x="30" y="10" fill="#1E293B" font-size="10" font-weight="600" font-family="sans-serif">Vitamin B Kompleks</text>
        <text x="30" y="22" fill="#64748B" font-size="8" font-family="sans-serif">1 Kapsul · Malam 20:00</text>
        <rect x="140" y="2" width="18" height="18" rx="4" fill="#CBD5E1"/>
      </g>
    </g>

    <!-- Bottom Nav -->
    <g transform="translate(10, 335)">
      <rect width="230" height="35" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="35" y="23" fill="#0284C7" font-size="14">🏠</text>
      <text x="95" y="23" fill="#94A3B8" font-size="14">📅</text>
      <text x="150" y="23" fill="#94A3B8" font-size="14">💬</text>
      <text x="195" y="23" fill="#94A3B8" font-size="14">👤</text>
    </g>
  </g>
</svg>
