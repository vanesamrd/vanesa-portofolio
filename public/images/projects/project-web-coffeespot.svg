  <rect x="540" y="370" width="186" height="24" rx="12" fill="#FFFFFF" stroke="#E5DDD3"/>
  <text x="554" y="386" fill="#5C3D2E" font-size="9" font-weight="600" font-family="sans-serif">3 cafe dalam radius 5 km</text>
