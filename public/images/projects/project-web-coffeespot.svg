  <path d="M 540 210 Q 610 190 640 240 T 730 280" stroke="#E5DDD3" stroke-width="10" fill="none"/>
  <path d="M 560 380 L 600 300 L 680 320 L 720 220" stroke="#E5DDD3" stroke-width="7" fill="none"/>
  <path d="M 640 380 L 640 200" stroke="#E5DDD3" stroke-width="5" fill="none"/>
  <path d="M 530 300 L 740 300" stroke="#E5DDD3" stroke-width="6" fill="none"/>
  <rect x="600" y="220" width="46" height="30" rx="5" fill="#E5DDD3" opacity="0.7"/>
