    <circle cx="672" cy="290" r="12" fill="#5C3D2E" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="672" cy="290" r="4" fill="#FFFFFF"/>
    <circle cx="628" cy="350" r="12" fill="#E8A84C" stroke="#FFFFFF" stroke-width="2"/>
