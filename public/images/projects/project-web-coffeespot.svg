    <text x="298" y="364" fill="#2C1810" font-size="12" font-weight="700" font-family="sans-serif">Halaman Belakang</text>
    <text x="298" y="380" fill="#8B7355" font-size="9" font-family="sans-serif">Jl. Veteran · 4.0 km</text>
