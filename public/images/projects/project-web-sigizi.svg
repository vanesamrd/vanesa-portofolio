<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGizi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGizi)"/>

  <!-- Main Container Card -->
  <rect x="40" y="30" width="720" height="390" rx="14" fill="#0F172A" stroke="#14B8A6" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="40" y="30" width="720" height="48" rx="14" fill="#134E4A"/>
  <circle cx="70" cy="54" r="14" fill="#14B8A6"/>
  <text x="63" y="60" fill="#FFFFFF" font-size="14">💚</text>
  <text x="95" y="60" fill="#FFFFFF" font-size="15" font-weight="bold" font-family="sans-serif">SiGizi - Pemantauan Gizi &amp; Stunting Balita</text>

  <rect x="575" y="42" width="165" height="26" rx="13" fill="#0F766E"/>
  <text x="590" y="59" fill="#99F6E4" font-size="11" font-weight="600" font-family="sans-serif">📊 4 Level Akses</text>

  <!-- Left: Growth Chart Panel -->
  <g transform="translate(56, 95)">
    <rect width="420" height="305" rx="8" fill="#134E4A" stroke="#14B8A6"/>

    <text x="16" y="28" fill="#F8FAFC" font-size="13" font-weight="bold" font-family="sans-serif">Grafik Tumbuh - BB/U &amp; TB/U</text>

    <!-- Chart grid -->
    <line x1="40" y1="60" x2="400" y2="60" stroke="#0F766E" stroke-width="1"/>
    <line x1="40" y1="110" x2="400" y2="110" stroke="#0F766E" stroke-width="1"/>
    <line x1="40" y1="160" x2="400" y2="160" stroke="#0F766E" stroke-width="1"/>
    <line x1="40" y1="210" x2="400" y2="210" stroke="#0F766E" stroke-width="1"/>
    <line x1="40" y1="260" x2="400" y2="260" stroke="#0F766E" stroke-width="1"/>

    <!-- Weight curve -->
    <polyline points="50,235 110,215 170,190 230,175 290,140 350,120 395,95" fill="none" stroke="#5EEAD4" stroke-width="3"/>
    <!-- Height curve -->
    <polyline points="50,255 110,240 170,225 230,205 290,190 350,170 395,150" fill="none" stroke="#FBBF24" stroke-width="3"/>

    <!-- Points -->
    <circle cx="110" cy="215" r="4" fill="#5EEAD4"/>
    <circle cx="230" cy="175" r="4" fill="#5EEAD4"/>
    <circle cx="350" cy="120" r="4" fill="#5EEAD4"/>
    <circle cx="110" cy="240" r="4" fill="#FBBF24"/>
    <circle cx="230" cy="205" r="4" fill="#FBBF24"/>
    <circle cx="350" cy="170" r="4" fill="#FBBF24"/>

    <!-- Legend -->
    <rect x="40" y="275" width="14" height="4" rx="2" fill="#5EEAD4"/>
    <text x="60" y="281" fill="#CCFBF1" font-size="10" font-family="sans-serif">Berat Badan (BB/U)</text>
    <rect x="190" y="275" width="14" height="4" rx="2" fill="#FBBF24"/>
    <text x="210" y="281" fill="#FDE68A" font-size="10" font-family="sans-serif">Tinggi Badan (TB/U)</text>
  </g>

  <!-- Right: Z-Score Status + AI Assistant -->
  <g transform="translate(492, 95)">
    <rect width="250" height="305" rx="8" fill="#134E4A" stroke="#14B8A6"/>

    <text x="16" y="28" fill="#F8FAFC" font-size="13" font-weight="bold" font-family="sans-serif">Status Gizi Anak</text>

    <!-- Status card 1 -->
    <rect x="14" y="44" width="222" height="52" rx="6" fill="#0F172A"/>
    <text x="26" y="66" fill="#5EEAD4" font-size="11" font-weight="600" font-family="sans-serif">Z-Score BB/U</text>
    <text x="26" y="85" fill="#F8FAFC" font-size="13" font-weight="bold" font-family="sans-serif">-0.82 · Normal</text>
    <rect x="170" y="56" width="52" height="24" rx="12" fill="#065F46"/>
    <text x="182" y="72" fill="#6EE7B7" font-size="10" font-weight="bold" font-family="sans-serif">NORMAL</text>

    <!-- Status card 2 -->
    <rect x="14" y="104" width="222" height="52" rx="6" fill="#0F172A"/>
    <text x="26" y="126" fill="#5EEAD4" font-size="11" font-weight="600" font-family="sans-serif">Z-Score TB/U</text>
    <text x="26" y="145" fill="#F8FAFC" font-size="13" font-weight="bold" font-family="sans-serif">-1.95 · Berisiko</text>
    <rect x="158" y="116" width="64" height="24" rx="12" fill="#92400E"/>
    <text x="167" y="132" fill="#FDE68A" font-size="10" font-weight="bold" font-family="sans-serif">RISIKO</text>

    <!-- AI Assistant card -->
    <rect x="14" y="164" width="222" height="84" rx="6" fill="#0F766E"/>
    <text x="26" y="186" fill="#CCFBF1" font-size="11" font-weight="bold" font-family="sans-serif">✨ Asisten AI SiGizi</text>
    <text x="26" y="206" fill="#E2E8F0" font-size="9.5" font-family="sans-serif">Tingkatkan asupan protein hewani</text>
    <text x="26" y="221" fill="#E2E8F0" font-size="9.5" font-family="sans-serif">(telur, ikan) dan pantau kembali</text>
    <text x="26" y="236" fill="#E2E8F0" font-size="9.5" font-family="sans-serif">pertumbuhan tiap bulan.</text>

    <!-- Referral button -->
    <rect x="14" y="258" width="222" height="34" rx="6" fill="#14B8A6"/>
    <text x="58" y="280" fill="#0F172A" font-size="11.5" font-weight="bold" font-family="sans-serif">Cetak Rujukan ke Puskesmas</text>
  </g>
</svg>
