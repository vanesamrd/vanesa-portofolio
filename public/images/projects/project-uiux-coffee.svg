<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgUx1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1508"/>
      <stop offset="50%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1E0B04"/>
    </linearGradient>
    <linearGradient id="coffeeBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgUx1)"/>

  <!-- Left Side: Case Study Overview & Persona Metrics -->
  <g transform="translate(60, 45)">
    <rect width="360" height="360" rx="14" fill="rgba(30, 20, 15, 0.75)" stroke="#78350F" stroke-width="1.5"/>
    
    <text x="24" y="38" fill="#FBBF24" font-size="12" font-weight="bold" font-family="sans-serif">UI/UX CASE STUDY · FIGMA</text>
    <text x="24" y="68" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="sans-serif">KopiKita Mobile Experience</text>
    <text x="24" y="90" fill="#FDE68A" font-size="12" font-family="sans-serif">Quick Order &amp; Digital Loyalty Stamp Ecosystem</text>

    <!-- Usability Score Card -->
    <rect x="24" y="112" width="312" height="75" rx="8" fill="#451A03" stroke="#92400E"/>
    <text x="40" y="140" fill="#FDE68A" font-size="11" font-family="sans-serif">System Usability Scale (SUS)</text>
    <text x="40" y="168" fill="#FFFFFF" font-size="24" font-weight="bold" font-family="sans-serif">87.5 / 100</text>
    <text x="180" y="165" fill="#34D399" font-size="12" font-weight="600" font-family="sans-serif">Grade A · Excellent</text>

    <!-- Design Process Pills -->
    <text x="24" y="215" fill="#E5E7EB" font-size="12" font-weight="600" font-family="sans-serif">Design Process Iterations:</text>
    
    <g transform="translate(24, 230)">
      <rect width="95" height="28" rx="14" fill="#78350F"/>
      <text x="12" y="18" fill="#FDE68A" font-size="10" font-family="sans-serif">1. User Survey</text>

      <rect x="105" y="0" width="95" height="28" rx="14" fill="#78350F"/>
      <text x="117" y="18" fill="#FDE68A" font-size="10" font-family="sans-serif">2. Wireframing</text>

      <rect x="210" y="0" width="100" height="28" rx="14" fill="#D97706"/>
      <text x="220" y="18" fill="#FFFFFF" font-size="10" font-weight="bold" font-family="sans-serif">3. Hi-Fi Prototype</text>
    </g>

    <!-- Key finding -->
    <rect x="24" y="275" width="312" height="70" rx="8" fill="#2E1307" stroke="#78350F"/>
    <text x="36" y="298" fill="#FBBF24" font-size="11" font-weight="bold" font-family="sans-serif">Insight Riset Pengguna:</text>
    <text x="36" y="316" fill="#D1D5DB" font-size="10" font-family="sans-serif">Pelanggan sering membatalkan order saat antrean kasir &gt;4 menit.</text>
    <text x="36" y="330" fill="#A7F3D0" font-size="10" font-family="sans-serif">Fitur "Quick Order 3-Tap" memangkas checkout hingga 65%.</text>
  </g>

  <!-- Right Side: Realistic Mobile Phone Mockup -->
  <g transform="translate(470, 30)">
    <!-- Phone Bezel -->
    <rect width="250" height="390" rx="36" fill="#18181B" stroke="#3F3F46" stroke-width="4"/>
    <!-- Phone Screen -->
    <rect x="10" y="10" width="230" height="370" rx="28" fill="#09090B"/>
    
    <!-- Dynamic Island / Notch -->
    <rect x="85" y="16" width="60" height="14" rx="7" fill="#000000"/>
    <circle cx="132" cy="23" r="3" fill="#27272A"/>

    <!-- Screen Content -->
    <!-- Top greeting -->
    <text x="24" y="55" fill="#A1A1AA" font-size="10" font-family="sans-serif">Selamat pagi,</text>
    <text x="24" y="72" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="sans-serif">Vanesa M. ✨</text>
    <circle cx="210" cy="62" r="14" fill="#D97706" fill-opacity="0.2"/>
    <text x="204" y="67" fill="#F59E0B" font-size="12">🔔</text>

    <!-- Digital Loyalty Card Widget -->
    <rect x="20" y="88" width="190" height="85" rx="12" fill="url(#coffeeBtn)"/>
    <text x="32" y="108" fill="#FFFFFF" font-size="10" font-weight="bold" font-family="sans-serif">KOPIKITA LOYALTY</text>
    <text x="145" y="108" fill="#FEF3C7" font-size="9" font-family="sans-serif">8 / 10 Stamp</text>
    
    <!-- Stamp Circles Row -->
    <g transform="translate(32, 118)">
      <circle cx="10" cy="12" r="8" fill="#FEF3C7"/><text x="6" y="16" fill="#B45309" font-size="9">✓</text>
      <circle cx="32" cy="12" r="8" fill="#FEF3C7"/><text x="28" y="16" fill="#B45309" font-size="9">✓</text>
      <circle cx="54" cy="12" r="8" fill="#FEF3C7"/><text x="50" y="16" fill="#B45309" font-size="9">✓</text>
      <circle cx="76" cy="12" r="8" fill="#FEF3C7"/><text x="72" y="16" fill="#B45309" font-size="9">✓</text>
      <circle cx="98" cy="12" r="8" fill="#FEF3C7"/><text x="94" y="16" fill="#B45309" font-size="9">✓</text>
      <circle cx="120" cy="12" r="8" fill="#FEF3C7"/><text x="116" y="16" fill="#B45309" font-size="9">✓</text>
      <circle cx="142" cy="12" r="8" fill="#92400E" stroke="#FEF3C7"/>
    </g>
    <text x="32" y="158" fill="#FEF3C7" font-size="9" font-family="sans-serif">2 stamp lagi untuk free Caramel Latte!</text>

    <!-- Section Header: Menu Favorit -->
    <text x="22" y="195" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="sans-serif">Favorit Kamu</text>
    
    <!-- Mini Product Card 1 -->
    <rect x="20" y="206" width="90" height="110" rx="10" fill="#18181B" stroke="#27272A"/>
    <rect x="28" y="214" width="74" height="46" rx="6" fill="#27272A"/>
    <text x="56" y="244" fill="#D97706" font-size="20" text-anchor="middle">☕</text>
    <text x="28" y="274" fill="#FFFFFF" font-size="9" font-weight="bold" font-family="sans-serif">Espresso Double</text>
    <text x="28" y="288" fill="#D97706" font-size="9" font-weight="bold" font-family="sans-serif">Rp 22.000</text>
    <circle cx="96" cy="298" r="8" fill="#D97706"/>
    <text x="93" y="302" fill="#FFF" font-size="10" font-weight="bold">+</text>

    <!-- Mini Product Card 2 -->
    <rect x="120" y="206" width="90" height="110" rx="10" fill="#18181B" stroke="#27272A"/>
    <rect x="128" y="214" width="74" height="46" rx="6" fill="#27272A"/>
    <text x="156" y="244" fill="#EC4899" font-size="20" text-anchor="middle">🧋</text>
    <text x="128" y="274" fill="#FFFFFF" font-size="9" font-weight="bold" font-family="sans-serif">Iced Oat Latte</text>
    <text x="128" y="288" fill="#D97706" font-size="9" font-weight="bold" font-family="sans-serif">Rp 28.000</text>
    <circle cx="196" cy="298" r="8" fill="#D97706"/>
    <text x="193" y="302" fill="#FFF" font-size="10" font-weight="bold">+</text>

    <!-- Bottom Navigation Bar -->
    <rect x="10" y="330" width="230" height="40" rx="14" fill="#18181B"/>
    <text x="40" y="354" fill="#D97706" font-size="14">🏠</text>
    <text x="95" y="354" fill="#71717A" font-size="14">☕</text>
    <text x="150" y="354" fill="#71717A" font-size="14">🎟️</text>
    <text x="200" y="354" fill="#71717A" font-size="14">👤</text>
  </g>
</svg>
