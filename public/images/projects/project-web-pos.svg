<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgPos)"/>

  <!-- Browser Frame Mockup -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <!-- Browser top bar -->
  <rect x="40" y="30" width="720" height="36" rx="12" fill="#0F172A"/>
  <circle cx="62" cy="48" r="5" fill="#EF4444"/>
  <circle cx="78" cy="48" r="5" fill="#F59E0B"/>
  <circle cx="94" cy="48" r="5" fill="#10B981"/>
  <!-- URL bar -->
  <rect x="120" y="38" width="360" height="20" rx="4" fill="#1E293B"/>
  <text x="135" y="52" fill="#94A3B8" font-size="10" font-family="monospace">https://kopikita.app/pos/outlet-1</text>

  <!-- POS Top Bar -->
  <rect x="56" y="78" width="688" height="44" rx="8" fill="#0F172A"/>
  <circle cx="80" cy="100" r="12" fill="#6366F1"/>
  <!-- Coffee Cup Icon -->
  <path d="M74 96 h12 v6 a6 6 0 0 1 -6 6 h0 a6 6 0 0 1 -6 -6 v-6 z" fill="#FFFFFF"/>
  <text x="100" y="105" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="sans-serif">KopiKita POS</text>
  <rect x="200" y="88" width="80" height="24" rx="12" fill="#10B981" fill-opacity="0.2"/>
  <text x="215" y="104" fill="#34D399" font-size="11" font-weight="600" font-family="sans-serif">● Online</text>
  
  <text x="640" y="104" fill="#94A3B8" font-size="11" font-family="sans-serif">Kasir: Vanesa</text>

  <!-- Left: Products Grid (Catalog) -->
  <g transform="translate(56, 134)">
    <rect width="440" height="270" rx="8" fill="#111827"/>
    
    <!-- Category Tabs -->
    <rect x="12" y="12" width="60" height="26" rx="6" fill="#4F46E5"/>
    <text x="24" y="29" fill="#FFF" font-size="11" font-family="sans-serif">Semua</text>
    <rect x="80" y="12" width="60" height="26" rx="6" fill="#1F2937"/>
    <text x="95" y="29" fill="#9CA3AF" font-size="11" font-family="sans-serif">Kopi</text>
    <rect x="148" y="12" width="70" height="26" rx="6" fill="#1F2937"/>
    <text x="160" y="29" fill="#9CA3AF" font-size="11" font-family="sans-serif">Non-Kopi</text>
    <rect x="226" y="12" width="60" height="26" rx="6" fill="#1F2937"/>
    <text x="240" y="29" fill="#9CA3AF" font-size="11" font-family="sans-serif">Pastry</text>

    <!-- Product Cards Grid -->
    <!-- Card 1 -->
    <rect x="12" y="50" width="130" height="96" rx="8" fill="#1F2937" stroke="#374151"/>
    <circle cx="40" cy="80" r="18" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="34" y="86" fill="#F59E0B" font-size="16">☕</text>
    <text x="64" y="75" fill="#F3F4F6" font-size="11" font-weight="600" font-family="sans-serif">Espresso</text>
    <text x="64" y="90" fill="#9CA3AF" font-size="9" font-family="sans-serif">Stok: 48</text>
    <text x="18" y="128" fill="#38BDF8" font-size="11" font-weight="bold" font-family="sans-serif">Rp 18.000</text>
    <rect x="106" y="114" width="28" height="24" rx="4" fill="#4F46E5"/>
    <text x="116" y="130" fill="#FFF" font-size="13" font-weight="bold">+</text>

    <!-- Card 2 -->
    <rect x="154" y="50" width="130" height="96" rx="8" fill="#1F2937" stroke="#374151"/>
    <circle cx="182" cy="80" r="18" fill="#EC4899" fill-opacity="0.2"/>
    <text x="176" y="86" fill="#EC4899" font-size="16">🧋</text>
    <text x="206" y="75" fill="#F3F4F6" font-size="11" font-weight="600" font-family="sans-serif">Caramel Latte</text>
    <text x="206" y="90" fill="#9CA3AF" font-size="9" font-family="sans-serif">Stok: 92</text>
    <text x="160" y="128" fill="#38BDF8" font-size="11" font-weight="bold" font-family="sans-serif">Rp 28.000</text>
    <rect x="248" y="114" width="28" height="24" rx="4" fill="#4F46E5"/>
    <text x="258" y="130" fill="#FFF" font-size="13" font-weight="bold">+</text>

    <!-- Card 3 -->
    <rect x="296" y="50" width="130" height="96" rx="8" fill="#1F2937" stroke="#374151"/>
    <circle cx="324" cy="80" r="18" fill="#10B981" fill-opacity="0.2"/>
