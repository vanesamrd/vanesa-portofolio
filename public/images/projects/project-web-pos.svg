    <text x="348" y="75" fill="#F3F4F6" font-size="11" font-weight="600" font-family="sans-serif">Matcha Ice</text>
    <text x="348" y="90" fill="#9CA3AF" font-size="9" font-family="sans-serif">Stok: 34</text>
    <text x="302" y="128" fill="#38BDF8" font-size="11" font-weight="bold" font-family="sans-serif">Rp 26.000</text>
    <rect x="390" y="114" width="28" height="24" rx="4" fill="#4F46E5"/>
    <text x="400" y="130" fill="#FFF" font-size="13" font-weight="bold">+</text>

    <!-- Card 4 & 5 (Second row) -->
    <rect x="12" y="156" width="130" height="96" rx="8" fill="#1F2937" stroke="#374151"/>
    <text x="30" y="195" fill="#F59E0B" font-size="18">🥐</text>
    <text x="64" y="180" fill="#F3F4F6" font-size="11" font-weight="600" font-family="sans-serif">Butter Croissant</text>
    <text x="64" y="195" fill="#9CA3AF" font-size="9" font-family="sans-serif">Stok: 15</text>
    <text x="18" y="234" fill="#38BDF8" font-size="11" font-weight="bold" font-family="sans-serif">Rp 22.000</text>
    <rect x="106" y="220" width="28" height="24" rx="4" fill="#4F46E5"/>
    <text x="116" y="236" fill="#FFF" font-size="13" font-weight="bold">+</text>

    <rect x="154" y="156" width="130" height="96" rx="8" fill="#1F2937" stroke="#374151"/>
    <text x="172" y="195" fill="#8B5CF6" font-size="18">🥤</text>
    <text x="206" y="180" fill="#F3F4F6" font-size="11" font-weight="600" font-family="sans-serif">Cold Brew Oat</text>
    <text x="206" y="195" fill="#9CA3AF" font-size="9" font-family="sans-serif">Stok: 27</text>
    <text x="160" y="234" fill="#38BDF8" font-size="11" font-weight="bold" font-family="sans-serif">Rp 30.000</text>
    <rect x="248" y="220" width="28" height="24" rx="4" fill="#4F46E5"/>
    <text x="258" y="236" fill="#FFF" font-size="13" font-weight="bold">+</text>

    <rect x="296" y="156" width="130" height="96" rx="8" fill="#1F2937" stroke="#374151"/>
    <text x="314" y="195" fill="#F43F5E" font-size="18">🍰</text>
    <text x="348" y="180" fill="#F3F4F6" font-size="11" font-weight="600" font-family="sans-serif">Berry Cheesecake</text>
    <text x="348" y="195" fill="#9CA3AF" font-size="9" font-family="sans-serif">Stok: 8</text>
    <text x="302" y="234" fill="#38BDF8" font-size="11" font-weight="bold" font-family="sans-serif">Rp 35.000</text>
    <rect x="390" y="220" width="28" height="24" rx="4" fill="#4F46E5"/>
    <text x="400" y="236" fill="#FFF" font-size="13" font-weight="bold">+</text>
  </g>

  <!-- Right: Current Order & Cart Receipt -->
  <g transform="translate(508, 134)">
    <rect width="236" height="270" rx="8" fill="#111827" stroke="#374151"/>
    <text x="16" y="28" fill="#F3F4F6" font-size="13" font-weight="bold" font-family="sans-serif">Pesanan #0084</text>
    <line x1="16" y1="40" x2="220" y2="40" stroke="#374151"/>

    <!-- Order Items -->
    <text x="16" y="65" fill="#F3F4F6" font-size="11" font-weight="600" font-family="sans-serif">2x Caramel Latte</text>
    <text x="16" y="80" fill="#9CA3AF" font-size="9" font-family="sans-serif">Less Sugar, Oatmilk</text>
    <text x="175" y="65" fill="#E5E7EB" font-size="11" font-family="sans-serif">Rp 56.000</text>

    <text x="16" y="110" fill="#F3F4F6" font-size="11" font-weight="600" font-family="sans-serif">1x Butter Croissant</text>
    <text x="16" y="125" fill="#9CA3AF" font-size="9" font-family="sans-serif">Warm toasted</text>
    <text x="175" y="110" fill="#E5E7EB" font-size="11" font-family="sans-serif">Rp 22.000</text>

    <line x1="16" y1="145" x2="220" y2="145" stroke="#374151" stroke-dasharray="4 2"/>

    <!-- Totals -->
    <text x="16" y="170" fill="#9CA3AF" font-size="11" font-family="sans-serif">Subtotal</text>
    <text x="175" y="170" fill="#E5E7EB" font-size="11" font-family="sans-serif">Rp 78.000</text>
    <text x="16" y="190" fill="#9CA3AF" font-size="11" font-family="sans-serif">PB1 (10%)</text>
    <text x="180" y="190" fill="#E5E7EB" font-size="11" font-family="sans-serif">Rp 7.800</text>

    <text x="16" y="215" fill="#F3F4F6" font-size="13" font-weight="bold" font-family="sans-serif">Total Bayar</text>
    <text x="160" y="215" fill="#10B981" font-size="13" font-weight="bold" font-family="sans-serif">Rp 85.800</text>

    <!-- Checkout Button -->
    <rect x="14" y="230" width="208" height="30" rx="6" fill="url(#primaryGrad)"/>
    <text x="75" y="249" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif">Bayar Sekarang (BCA)</text>
  </g>
</svg>
