<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgFin)"/>

  <!-- Dashboard Frame -->
  <rect x="40" y="30" width="720" height="390" rx="14" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="40" y="30" width="720" height="46" rx="14" fill="#09090B"/>
  <circle cx="68" cy="53" r="12" fill="#8B5CF6"/>
  <text x="62" y="58" fill="#FFF" font-size="12">💎</text>
  <text x="90" y="58" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="sans-serif">FinVibe Dashboard</text>
  
  <rect x="580" y="40" width="160" height="26" rx="6" fill="#27272A"/>
  <text x="595" y="57" fill="#E4E4E7" font-size="11" font-family="sans-serif">📅 Oktober 2026 ▾</text>

  <!-- Left: Balance & Donut Expense Breakdown -->
  <g transform="translate(60, 95)">
    <rect width="320" height="305" rx="10" fill="#27272A" stroke="#3F3F46"/>
    
    <!-- Balance Card -->
    <rect x="16" y="16" width="288" height="90" rx="10" fill="url(#violetGrad)"/>
    <text x="32" y="42" fill="#DDD6FE" font-size="11" font-family="sans-serif">Total Saldo Aktif</text>
    <text x="32" y="74" fill="#FFFFFF" font-size="24" font-weight="bold" font-family="sans-serif">Rp 14.850.000</text>
    <text x="32" y="94" fill="#C4B5FD" font-size="10" font-family="sans-serif">▲ +12.4% dari bulan lalu</text>

    <!-- Expense Ring Chart -->
    <text x="16" y="132" fill="#F4F4F5" font-size="12" font-weight="bold" font-family="sans-serif">Alokasi Anggaran Bulanan</text>
    
    <!-- Donut Segments -->
    <circle cx="85" cy="210" r="50" fill="none" stroke="#3F3F46" stroke-width="18"/>
    <circle cx="85" cy="210" r="50" fill="none" stroke="#8B5CF6" stroke-width="18" stroke-dasharray="157 314" stroke-dashoffset="0"/>
    <circle cx="85" cy="210" r="50" fill="none" stroke="#06B6D4" stroke-width="18" stroke-dasharray="94 314" stroke-dashoffset="-157"/>
    <circle cx="85" cy="210" r="50" fill="none" stroke="#F59E0B" stroke-width="18" stroke-dasharray="63 314" stroke-dashoffset="-251"/>
    
    <text x="85" y="210" fill="#FFF" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">50/30/20</text>
    <text x="85" y="224" fill="#A1A1AA" font-size="9" font-family="sans-serif" text-anchor="middle">Rule</text>

    <!-- Legend -->
    <g transform="translate(170, 160)">
      <circle cx="8" cy="12" r="5" fill="#8B5CF6"/>
      <text x="20" y="16" fill="#E4E4E7" font-size="10" font-family="sans-serif">Kebutuhan (50%)</text>
      
      <circle cx="8" cy="40" r="5" fill="#06B6D4"/>
      <text x="20" y="44" fill="#E4E4E7" font-size="10" font-family="sans-serif">Keinginan (30%)</text>

      <circle cx="8" cy="68" r="5" fill="#F59E0B"/>
      <text x="20" y="72" fill="#E4E4E7" font-size="10" font-family="sans-serif">Tabungan &amp; Invest (20%)</text>
    </g>
  </g>

  <!-- Right: Saving Goals & Recent Transactions -->
  <g transform="translate(400, 95)">
    <rect width="340" height="305" rx="10" fill="#27272A" stroke="#3F3F46"/>
    
    <text x="16" y="28" fill="#F4F4F5" font-size="13" font-weight="bold" font-family="sans-serif">Saving Goals (Target Tabungan)</text>

    <!-- Goal 1 -->
    <rect x="16" y="44" width="308" height="58" rx="8" fill="#18181B"/>
    <text x="28" y="66" fill="#FFFFFF" font-size="11" font-weight="600" font-family="sans-serif">💻 MacBook Pro M-Series</text>
    <text x="235" y="66" fill="#10B981" font-size="11" font-weight="bold" font-family="sans-serif">85%</text>
    <rect x="28" y="76" width="284" height="8" rx="4" fill="#3F3F46"/>
    <rect x="28" y="76" width="241" height="8" rx="4" fill="#10B981"/>
    <text x="28" y="94" fill="#A1A1AA" font-size="9" font-family="sans-serif">Terkumpul: Rp 17.000.000 / Rp 20.000.000</text>

    <!-- Goal 2 -->
    <rect x="16" y="112" width="308" height="58" rx="8" fill="#18181B"/>
    <text x="28" y="134" fill="#FFFFFF" font-size="11" font-weight="600" font-family="sans-serif">🎓 Sertifikasi Cloud &amp; AI</text>
    <text x="235" y="134" fill="#38BDF8" font-size="11" font-weight="bold" font-family="sans-serif">60%</text>
    <rect x="28" y="144" width="284" height="8" rx="4" fill="#3F3F46"/>
    <rect x="28" y="144" width="170" height="8" rx="4" fill="#38BDF8"/>
    <text x="28" y="162" fill="#A1A1AA" font-size="9" font-family="sans-serif">Terkumpul: Rp 3.000.000 / Rp 5.000.000</text>

    <!-- Recent Expenses List -->
    <text x="16" y="196" fill="#F4F4F5" font-size="12" font-weight="bold" font-family="sans-serif">Aktivitas Terakhir</text>

    <g transform="translate(16, 210)">
      <rect width="308" height="38" rx="6" fill="#18181B"/>
      <text x="12" y="24" fill="#E4E4E7" font-size="10" font-family="sans-serif">☕ KopiKita - Arabica Beans</text>
      <text x="230" y="24" fill="#EF4444" font-size="11" font-weight="bold" font-family="sans-serif">- Rp 48.000</text>
    </g>

    <g transform="translate(16, 255)">
      <rect width="308" height="38" rx="6" fill="#18181B"/>
      <text x="12" y="24" fill="#E4E4E7" font-size="10" font-family="sans-serif">💼 Transfer Fee Freelance UI</text>
      <text x="220" y="24" fill="#10B981" font-size="11" font-weight="bold" font-family="sans-serif">+ Rp 1.850.000</text>
    </g>
  </g>
</svg>
