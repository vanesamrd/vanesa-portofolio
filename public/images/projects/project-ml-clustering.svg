<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0A1128"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgMl)"/>

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.3">
    <line x1="80" y1="40" x2="80" y2="410"/>
    <line x1="160" y1="40" x2="160" y2="410"/>
    <line x1="240" y1="40" x2="240" y2="410"/>
    <line x1="320" y1="40" x2="320" y2="410"/>
    <line x1="400" y1="40" x2="400" y2="410"/>
    <line x1="480" y1="40" x2="480" y2="410"/>
    <line x1="560" y1="40" x2="560" y2="410"/>
    <line x1="640" y1="40" x2="640" y2="410"/>
    <line x1="720" y1="40" x2="720" y2="410"/>
    
    <line x1="40" y1="80" x2="760" y2="80"/>
    <line x1="40" y1="140" x2="760" y2="140"/>
    <line x1="40" y1="200" x2="760" y2="200"/>
    <line x1="40" y1="260" x2="760" y2="260"/>
    <line x1="40" y1="320" x2="760" y2="320"/>
    <line x1="40" y1="380" x2="760" y2="380"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="30" width="310" height="38" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="70" cy="49" r="6" fill="#10B981"/>
  <text x="88" y="54" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">K-Means &amp; DBSCAN · Coffee Chain Demand</text>

  <!-- Metric Badges Top Right -->
  <g transform="translate(520, 30)">
    <rect width="105" height="36" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="12" y="17" fill="#94A3B8" font-size="10" font-family="sans-serif">Transactions</text>
    <text x="12" y="30" fill="#38BDF8" font-size="13" font-weight="bold" font-family="sans-serif">53,820</text>
  </g>
  <g transform="translate(645, 30)">
    <rect width="105" height="36" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="12" y="17" fill="#94A3B8" font-size="10" font-family="sans-serif">Silhouette</text>
    <text x="12" y="30" fill="#4ADE80" font-size="13" font-weight="bold" font-family="sans-serif">0.217 (HDBSCAN)</text>
  </g>

  <!-- Main Scatter / Clustering Display Panel -->
  <rect x="50" y="85" width="460" height="330" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="90" y1="375" x2="475" y2="375" stroke="#64748B" stroke-width="2"/>
  <line x1="90" y1="375" x2="90" y2="120" stroke="#64748B" stroke-width="2"/>
  <text x="400" y="395" fill="#94A3B8" font-size="11" font-family="sans-serif">Mean Daily Sales</text>
  <text x="35" y="140" fill="#94A3B8" font-size="11" font-family="sans-serif" transform="rotate(-90 45,140)">Coefficient of Variation</text>

  <!-- Cluster 1: Bintang Harian (High Sales, Stable) - EMERALD GREEN -->
  <g fill="#10B981" opacity="0.85">
    <ellipse cx="400" cy="180" rx="45" ry="35" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-dasharray="4 3"/>
    <circle cx="410" cy="175" r="7"/>
    <circle cx="390" cy="190" r="6"/>
    <circle cx="425" cy="165" r="8"/>
    <circle cx="380" cy="170" r="5.5"/>
    <circle cx="415" cy="195" r="6"/>
    <!-- Centroid -->
    <polygon points="405,165 410,180 395,170 415,170 400,180" fill="#FDE047"/>
  </g>

  <!-- Cluster 2: Konsisten Moderat - SKY BLUE -->
  <g fill="#0EA5E9" opacity="0.85">
    <ellipse cx="270" cy="240" rx="60" ry="40" fill="#0EA5E9" opacity="0.15" stroke="#0EA5E9" stroke-dasharray="4 3"/>
    <circle cx="250" cy="230" r="6"/>
    <circle cx="280" cy="225" r="7"/>
    <circle cx="260" cy="255" r="5"/>
    <circle cx="295" cy="245" r="6"/>
    <circle cx="240" cy="250" r="6.5"/>
    <circle cx="275" cy="265" r="5.5"/>
    <!-- Centroid -->
    <polygon points="270,225 275,240 260,230 280,230 265,240" fill="#FDE047"/>
  </g>

  <!-- Cluster 3: Weekend/Seasonal - PURPLE -->
  <g fill="#A855F7" opacity="0.85">
    <ellipse cx="210" cy="160" rx="45" ry="35" fill="#A855F7" opacity="0.15" stroke="#A855F7" stroke-dasharray="4 3"/>
    <circle cx="195" cy="150" r="6"/>
    <circle cx="220" cy="145" r="7"/>
    <circle cx="205" cy="175" r="5"/>
    <circle cx="225" cy="168" r="6"/>
    <!-- Centroid -->
    <polygon points="210,145 215,160 200,150 220,150 205,160" fill="#FDE047"/>
  </g>

  <!-- Cluster 4: Slow Moving - ORANGE -->
  <g fill="#F97316" opacity="0.85">
    <ellipse cx="150" cy="310" rx="40" ry="30" fill="#F97316" opacity="0.15" stroke="#F97316" stroke-dasharray="4 3"/>
    <circle cx="140" cy="300" r="5.5"/>
    <circle cx="160" cy="315" r="6"/>
    <circle cx="135" cy="320" r="5"/>
    <circle cx="165" cy="305" r="6"/>
    <!-- Centroid -->
    <polygon points="150,298 155,312 142,303 158,303 145,312" fill="#FDE047"/>
  </g>

  <!-- DBSCAN Noise / Outlier Points (Red X) -->
  <g stroke="#EF4444" stroke-width="2" opacity="0.8">
    <line x1="445" y1="120" x2="455" y2="130"/><line x1="455" y1="120" x2="445" y2="130"/>
    <line x1="120" y1="120" x2="130" y2="130"/><line x1="130" y1="120" x2="120" y2="130"/>
    <line x1="330" y1="340" x2="340" y2="350"/><line x1="340" y1="340" x2="330" y2="350"/>
  </g>

  <!-- Side Panel: Algorithm Comparison -->
  <rect x="530" y="85" width="220" height="330" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="548" y="115" fill="#F8FAFC" font-size="14" font-weight="bold" font-family="sans-serif">Model Benchmark</text>

  <!-- Model 1 -->
  <rect x="546" y="130" width="188" height="52" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="558" y="150" fill="#F8FAFC" font-size="12" font-weight="600" font-family="sans-serif">K-Means (Euclidean)</text>
  <text x="558" y="168" fill="#10B981" font-size="11" font-family="sans-serif">✓ Model Pilihan Utama (k=4)</text>

  <!-- Model 2 -->
  <rect x="546" y="190" width="188" height="52" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="558" y="210" fill="#E2E8F0" font-size="12" font-weight="600" font-family="sans-serif">HDBSCAN</text>
  <text x="558" y="228" fill="#38BDF8" font-size="11" font-family="sans-serif">Silh: 0.217 | Noise: 45.7%</text>

  <!-- Model 3 -->
  <rect x="546" y="250" width="188" height="52" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="558" y="270" fill="#E2E8F0" font-size="12" font-weight="600" font-family="sans-serif">DBSCAN (Manhattan)</text>
  <text x="558" y="288" fill="#A855F7" font-size="11" font-family="sans-serif">eps=4.0 | Davies-B: 0.985</text>

  <!-- Metrics note -->
  <rect x="546" y="312" width="188" height="88" rx="8" fill="rgba(59, 130, 246, 0.08)" stroke="#3B82F6" stroke-width="1"/>
  <text x="556" y="332" fill="#93C5FD" font-size="11" font-weight="600" font-family="sans-serif">Insight Riset:</text>
  <text x="556" y="348" fill="#CBD5E1" font-size="10" font-family="sans-serif">• ARI K-Means vs Manhattan: 0.88</text>
  <text x="556" y="364" fill="#CBD5E1" font-size="10" font-family="sans-serif">• Transaksi BCA mendominasi</text>
  <text x="556" y="380" fill="#CBD5E1" font-size="10" font-family="sans-serif">• 86% pesanan single-item</text>
</svg>
