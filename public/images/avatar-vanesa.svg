<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8D7"/>
      <stop offset="100%" stop-color="#FAD2B8"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1B36"/>
      <stop offset="100%" stop-color="#180B22"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Circle with glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="185" fill="#0F172A" opacity="0.92"/>

  <!-- Background Tech Elements -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <circle cx="200" cy="200" r="140" stroke-dasharray="8 6"/>
    <circle cx="200" cy="200" r="165" stroke-dasharray="4 8"/>
    <path d="M 60 120 L 100 120 L 120 90"/>
    <path d="M 340 280 L 300 280 L 280 310"/>
    <text x="70" y="80" fill="#EC4899" font-family="monospace" font-size="14">&lt;code&gt;</text>
    <text x="290" y="340" fill="#8B5CF6" font-family="monospace" font-size="14">&lt;/design&gt;</text>
  </g>

  <!-- Character Group -->
  <g id="character" filter="url(#shadow)">
    <!-- Back Hair Volume -->
    <path d="M125 150 C105 220 115 310 135 340 C140 290 145 220 148 180 Z" fill="url(#hairGrad)"/>
    <path d="M275 150 C295 220 285 310 265 340 C260 290 255 220 252 180 Z" fill="url(#hairGrad)"/>
    <path d="M130 140 C120 70 280 70 270 140 C285 240 280 320 270 340 C250 350 150 350 130 340 C120 320 115 240 130 140 Z" fill="url(#hairGrad)"/>

    <!-- Shoulders / Clothes -->
    <path d="M110 370 C120 310 160 280 200 280 C240 280 280 310 290 370 C295 385 285 400 200 400 C115 400 105 385 110 370 Z" fill="url(#hoodieGrad)"/>
    <!-- Collar & Shirt -->
    <path d="M185 280 L200 320 L215 280 Z" fill="#FDE8D7"/>
    <path d="M170 320 Q200 345 230 320" stroke="#4338CA" stroke-width="3" fill="none"/>
    <circle cx="200" cy="355" r="4" fill="#A5B4FC"/>

    <!-- Neck -->
    <rect x="186" y="240" width="28" height="48" rx="10" fill="url(#skinGrad)"/>

    <!-- Head / Face -->
    <ellipse cx="200" cy="185" rx="55" ry="65" fill="url(#skinGrad)"/>

    <!-- Cute Blush -->
    <circle cx="165" cy="200" r="10" fill="#F43F5E" opacity="0.25"/>
    <circle cx="235" cy="200" r="10" fill="#F43F5E" opacity="0.25"/>

    <!-- Eyes (Friendly, intelligent look) -->
    <ellipse cx="178" cy="180" rx="6" ry="7" fill="#1E1B4B"/>
    <ellipse cx="222" cy="180" rx="6" ry="7" fill="#1E1B4B"/>
    <circle cx="180" cy="178" r="2.2" fill="#FFFFFF"/>
    <circle cx="224" cy="178" r="2.2" fill="#FFFFFF"/>
    <!-- Eyelashes -->
    <path d="M170 174 Q178 170 186 174" stroke="#1E1B4B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M214 174 Q222 170 230 174" stroke="#1E1B4B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M184 172 L188 168" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M216 172 L212 168" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M168 164 Q178 160 188 165" stroke="#37273F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M212 165 Q222 160 232 164" stroke="#37273F" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M198 188 Q200 196 204 196" stroke="#E2A687" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Sweet Smile -->
    <path d="M188 214 Q200 226 212 214" stroke="#D946EF" stroke-width="3" fill="#FFFFFF" stroke-linecap="round"/>

    <!-- Stylish Modern Glasses -->
    <g stroke="#EC4899" stroke-width="2.8" fill="rgba(255, 255, 255, 0.12)">
      <rect x="160" y="168" width="34" height="26" rx="8"/>
      <rect x="206" y="168" width="34" height="26" rx="8"/>
      <path d="M194 178 L206 178" fill="none"/>
      <!-- Glasses rim reflection -->
      <line x1="164" y1="172" x2="174" y2="172" stroke="#FFFFFF" stroke-width="1.8" opacity="0.6"/>
      <line x1="210" y1="172" x2="220" y2="172" stroke="#FFFFFF" stroke-width="1.8" opacity="0.6"/>
    </g>

    <!-- Front Bangs / Hair Layers -->
    <path d="M145 155 C150 110 250 110 255 155 C240 135 210 135 195 145 C180 132 155 135 145 155 Z" fill="url(#hairGrad)"/>
    <path d="M142 165 C146 130 185 125 188 150 C182 135 160 135 142 165 Z" fill="#3D2548"/>
    <path d="M258 165 C254 130 215 125 212 150 C218 135 240 135 258 165 Z" fill="#3D2548"/>
    <path d="M140 175 C145 230 160 260 165 270 C160 250 150 215 150 175 Z" fill="url(#hairGrad)"/>
    <path d="M260 175 C255 230 240 260 235 270 C240 250 250 215 250 175 Z" fill="url(#hairGrad)"/>

    <!-- Tech Headset (Cyan/Purple Gamer & Dev Headset) -->
    <path d="M136 170 C136 115 264 115 264 170" stroke="#06B6D4" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="127" y="165" width="16" height="34" rx="8" fill="#0891B2" stroke="#06B6D4" stroke-width="2"/>
    <rect x="257" y="165" width="16" height="34" rx="8" fill="#0891B2" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="135" cy="182" r="4" fill="#A5F3FC"/>
    <circle cx="265" cy="182" r="4" fill="#A5F3FC"/>
    <!-- Mic stem -->
    <path d="M135 195 Q145 228 175 224" stroke="#06B6D4" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="177" cy="223" r="4" fill="#EC4899"/>
  </g>

  <!-- Online Badge in corner -->
  <g transform="translate(290, 275)">
    <circle cx="16" cy="16" r="16" fill="#10B981" stroke="#0F172A" stroke-width="4"/>
    <circle cx="16" cy="16" r="8" fill="#FFFFFF"/>
  </g>
</svg>
